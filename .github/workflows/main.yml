name: Automated Responsive Audit

on:
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য
  schedule:
    - cron: '0 0 * * 0' # প্রতি সপ্তাহে অটো রান

jobs:
  audit-job:
    runs-on: ubuntu-latest
    
    # গিটহাবের নতুন নোড ২৪ ওয়ার্নিং ফিক্স করার জন্য এনভায়রনমেন্ট সেটআপ
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # নোড ২৪ ব্যবহার করা হচ্ছে

    - name: Install Google Chrome & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable libgbm-dev

    - name: Install Dependencies
      run: |
        npm install

    - name: Run Responsive Test Script
      run: |
        node audit.js

    - name: Commit and Push Screenshots & Report
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add screenshots/ report.json || true
        git commit -m "Automated responsive audit report updated [skip ci]" || exit 0
        git push
