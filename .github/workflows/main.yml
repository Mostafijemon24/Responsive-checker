name: Automated Responsive Audit

on:
  workflow_dispatch: # এর মাধ্যমে আপনি গিটহাব ড্যাশবোর্ড থেকে ১-ক্লিকে রান করতে পারবেন
  schedule:
    - cron: '0 0 * * 0' # এটি প্রতি সপ্তাহে রবিবার রাত ১২টায় অটোমেটিক রান হবে

jobs:
  audit-job:
    runs-on: ubuntu-latest # গিটহাবের ফ্রি লিনাক্স সার্ভার

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-level: '18'

    - name: Install Dependencies
      run: |
        npm install

    - name: Run Responsive Test Script
      run: |
        node audit.js

    - name: Commit and Push Screenshots & Report
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add screenshots/ report.json
        git commit -m "Automated responsive audit report updated [skip ci]" || exit 0
        git push