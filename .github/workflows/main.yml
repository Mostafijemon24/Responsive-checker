name: Automated Responsive Audit

on:
  workflow_dispatch: # ১-ক্লিকে রান করার জন্য
  schedule:
    - cron: '0 0 * * 0' # প্রতি সপ্তাহে অটোমেটিক রান হবে

jobs:
  audit-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # (ফিক্স করা হয়েছে: node-level এর জায়গায় node-version হবে)

    - name: Install Google Chrome (For Puppeteer)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Dependencies
      run: |
        npm install

    - name: Run Responsive Test Script
      run: |
        node audit.js

    - name: Commit and Push Screenshots & Report
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add screenshots/ report.json || true
        git commit -m "Automated responsive audit report updated [skip ci]" || exit 0
        git push